<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Triage queue next — mocks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #f8fafc;
      --bg-mid: #f1f5f9;
      --bg-elev: #ffffff;
      --bg-hover: #e2eaf5;
      --border: #cbd5e1;
      --border-hi: #94a3b8;
      --text-1: #0f172a;
      --text-2: #1e3a5f;
      --text-3: #475569;
      --text-4: #556377;
      --text-5: #5f6f85;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-dim: rgba(37, 99, 235, 0.09);
      --accent-line: rgba(37, 99, 235, 0.3);
      --green: #16a34a;
      --green-dim: rgba(22, 163, 74, 0.09);
      --green-line: rgba(22, 163, 74, 0.3);
      --amber: #b45309;
      --amber-dim: rgba(180, 83, 9, 0.09);
      --amber-line: rgba(180, 83, 9, 0.32);
      --red: #dc2626;
      --red-dim: rgba(220, 38, 38, 0.08);
      --red-line: rgba(220, 38, 38, 0.3);
      --violet: #7c3aed;
      --violet-dim: rgba(124, 58, 237, 0.09);
      --violet-line: rgba(124, 58, 237, 0.3);
      --r-sm: 4px;
      --r-md: 6px;
      --r-lg: 8px;
      --r-pill: 999px;
      --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-2: 0 2px 8px rgba(15, 23, 42, 0.08);
      --shadow-3: 0 8px 28px rgba(15, 23, 42, 0.14);
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --fast: 120ms;
      --med: 200ms;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --header-bg: #1e3a5f;
    }
    html[data-colorblind="true"] {
      --red: #ea580c;
      --red-dim: rgba(234, 88, 12, 0.1);
      --red-line: rgba(234, 88, 12, 0.34);
      --green: #2563eb;
      --green-dim: rgba(37, 99, 235, 0.09);
      --green-line: rgba(37, 99, 235, 0.3);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: #0b1424;
      color: var(--text-1);
      min-height: 100vh;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 20px 48px;
    }
    .page.shot {
      padding: 16px;
      background: #0b1424;
    }

    .chooser {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .chooser button {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: var(--r-md);
      border: 1px solid #2a4060;
      background: #131e34;
      color: #93a8c5;
      cursor: pointer;
    }
    .chooser button[aria-current="true"] {
      background: rgba(91, 143, 199, 0.14);
      border-color: rgba(91, 143, 199, 0.35);
      color: #cfe1ff;
    }
    .page.shot .chooser { display: none; }

    .frame { display: none; }
    .frame.is-on { display: block; }

    .caption {
      font-size: 12px;
      font-weight: 600;
      color: #cfe1ff;
      margin: 0 0 6px;
    }
    .subcap {
      font-size: 11px;
      color: #7d97b5;
      margin: 0 0 12px;
      line-height: 1.45;
      max-width: 72ch;
    }

    /* Fake Medicus chrome */
    .desk {
      background: #e8eef4;
      border: 1px solid #1c2e4e;
      border-radius: 10px;
      box-shadow: var(--shadow-3);
      overflow: hidden;
    }
    .os-bar {
      height: 36px;
      background: #d5dde6;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid #c5ced8;
    }
    .os-dots { display: flex; gap: 6px; }
    .os-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .os-dots i:nth-child(1) { background: #ff5f57; }
    .os-dots i:nth-child(2) { background: #febc2e; }
    .os-dots i:nth-child(3) { background: #28c840; }
    .os-url {
      flex: 1;
      background: #f4f7fa;
      border: 1px solid #c5ced8;
      border-radius: 6px;
      height: 22px;
      font: 10px/22px var(--mono);
      color: #5f6f85;
      padding: 0 10px;
    }

    .app-bar {
      background: var(--header-bg);
      color: #f8fafc;
      padding: 10px 14px 9px;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .app-bar .brand {
      font-size: 13px;
      font-weight: 700;
    }
    .app-bar .crumb {
      font-size: 11px;
      opacity: 0.72;
    }
    .app-bar .meta {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      opacity: 0.7;
    }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      color: var(--text-1);
    }
    .toolbar .count {
      font-family: var(--mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-3);
    }
    .huddle {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .huddle b {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border);
      background: var(--bg-mid);
      color: var(--text-2);
    }
    .huddle b.hot {
      background: var(--red-dim);
      border-color: var(--red-line);
      color: var(--red);
    }

    .grid {
      background: #fff;
    }
    .g-head, .g-row {
      display: grid;
      grid-template-columns: 10px 28px minmax(200px, 1.25fr) 78px 108px minmax(320px, 2.6fr) 42px;
      align-items: stretch;
    }
    .g-head {
      background: var(--bg-mid);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-4);
    }
    .g-head > span, .g-row > .cell {
      padding: 7px 8px;
      border-right: 1px solid #e8eef4;
    }
    .g-row {
      border-bottom: 1px solid #e8eef4;
      background: #fff;
      min-height: 40px;
    }
    .g-row:nth-child(even) { background: #fbfdff; }
    .g-row.is-cursor {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
    }
    .g-row.is-seen { opacity: 0.55; }

    .rail {
      padding: 0 !important;
      position: relative;
    }
    .rail i.red {
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--red);
    }
    .rail i.amber {
      position: absolute;
      top: 50%;
      left: 1px;
      width: 8px;
      height: 8px;
      margin-top: -4px;
      border: 2px solid var(--amber);
      border-radius: 50%;
      background: transparent;
    }
    .rail i.unchecked {
      position: absolute;
      inset: 4px auto 4px 2px;
      width: 3px;
      background: repeating-linear-gradient(
        to bottom,
        var(--border-hi) 0 3px,
        transparent 3px 6px
      );
    }

    .name {
      font-size: 12.5px;
      font-weight: 650;
      color: var(--accent);
      line-height: 1.25;
    }
    .name .age {
      display: block;
      font-weight: 500;
      font-size: 10px;
      color: var(--text-3);
      margin-top: 1px;
    }
    .thread-mark {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      font-family: var(--mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--text-3);
      background: var(--bg-mid);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 1px 7px;
    }
    .thread-mark strong { color: var(--text-1); font-weight: 650; }

    .check {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border-hi);
      font-size: 13px;
    }
    .cell.pri, .cell.created, .cell.who {
      font-size: 11px;
      color: var(--text-2);
    }
    .cell.created {
      font-family: var(--mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--text-3);
    }
    .pri-u {
      color: var(--red);
      font-weight: 650;
    }

    .preview {
      font-size: 12px;
      color: var(--text-1);
      line-height: 1.35;
    }
    .preview .req {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: var(--r-pill);
      font-size: 10px;
      font-weight: 550;
      line-height: 1.4;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .chip.red { background: var(--red-dim); color: var(--red); border-color: var(--red-line); }
    .chip.amber { background: var(--amber-dim); color: var(--amber); border-color: var(--amber-line); }
    .chip.green { background: var(--green-dim); color: var(--green); border-color: var(--green-line); }
    .chip.info { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-line); }
    .chip.meta { background: transparent; color: var(--text-4); border-color: var(--border); }
    .chip.dash { background: transparent; border-style: dashed; }

    .pulse-head {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .pulse-head .chip { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
    .more {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
    }
    .diamond {
      width: 8px;
      height: 8px;
      background: var(--red);
      transform: rotate(45deg);
      flex: 0 0 8px;
      box-shadow: 0 0 0 1px var(--red-line);
    }
    .diamond.amber { background: var(--amber); box-shadow: 0 0 0 1px var(--amber-line); }
    .eye {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--violet);
      background: var(--violet-dim);
      border: 1px solid var(--violet-line);
      border-radius: var(--r-pill);
      padding: 1px 7px;
      margin-left: 6px;
    }
    .eye svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }

    .act-btn {
      align-self: center;
      justify-self: center;
      width: 26px;
      height: 26px;
      border-radius: var(--r-md);
      border: 1px solid var(--border-hi);
      background: #fff;
      color: var(--text-3);
      font-size: 16px;
      line-height: 1;
      cursor: default;
    }
    .act-btn.on {
      background: var(--accent-dim);
      border-color: var(--accent-line);
      color: var(--text-2);
    }

    .tray {
      grid-column: 1 / -1;
      background: var(--bg-deep);
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px 22px;
    }
    .tray h3 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 650;
      color: var(--text-2);
    }
    .why-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 5px;
    }
    .why-list li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      font-size: 12px;
      color: var(--text-1);
      align-items: start;
    }
    .why-list .mark {
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 2px;
    }
    .why-list .mark.red { background: var(--red); }
    .why-list .mark.amber {
      background: transparent;
      border: 2px solid var(--amber);
      border-radius: 50%;
    }
    .why-list .mark.info { background: var(--accent); }
    .why-list .src {
      display: block;
      font-size: 11px;
      color: var(--text-3);
      margin-top: 1px;
    }
    .why-foot {
      margin: 10px 0 0;
      font-size: 11px;
      color: var(--text-4);
      font-style: italic;
    }

    .acts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .acts button {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 550;
      padding: 7px 10px;
      border-radius: var(--r-md);
      border: 1px solid var(--border-hi);
      background: #fff;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 168px;
    }
    .acts button small {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-4);
    }
    .acts button em {
      font-family: var(--mono);
      font-style: normal;
      font-size: 10px;
      color: var(--text-3);
      margin-right: 4px;
    }
    .acts button.primary {
      background: var(--accent-dim);
      border-color: var(--accent-line);
    }
    .acts button:disabled {
      opacity: 0.45;
    }

    .confirm {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--r-md);
      background: var(--amber-dim);
      border: 1px solid var(--amber-line);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-1);
    }
    .confirm strong { color: var(--amber); }
    .confirm .go {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: var(--r-md);
      border: 1px solid var(--accent-line);
      background: var(--accent);
      color: var(--bg-deep);
    }

    .stack {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      border-left: 2px solid var(--border);
      display: grid;
      gap: 6px;
    }
    .stack li {
      padding: 0 0 0 10px;
      font-size: 11px;
      color: var(--text-2);
    }
    .stack time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-4);
      margin-right: 6px;
    }

    .legend {
      display: flex;
      gap: 14px;
      padding: 8px 12px 10px;
      background: #fff;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-4);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
    .swatch.red { background: var(--red); }
    .swatch.amber {
      background: #fff;
      border: 2px solid var(--amber);
      border-radius: 50%;
    }
    .swatch.dash {
      background: repeating-linear-gradient(to bottom, var(--border-hi) 0 2px, #fff 2px 4px);
    }
    .swatch.dia {
      width: 8px;
      height: 8px;
      background: var(--red);
      transform: rotate(45deg);
      border-radius: 0;
    }
  </style>
</head>

      { when: "Fri 15 Aug", text: "Rash on the arm" },
      { when: "8 Aug", text: "Can I have a cream for a spot" },
    ],
    silent: false,
    presence: false,
    checked: true,
  },
  {
    id: "john",
    name: "Smith, John",
    age: "56 y",
    dob: "01 Sep 1969 (56 y)",
    priority: "Routine",
    created: "20 Aug 09:47",
    who: "Dr Chen",
    request: "Can I have some more of the painkillers for my knee, the last lot ran out",
    signals: [],
    thread: [],
    silent: false,
    presence: true,
    checked: true,
    seen: false,
  },
  {
    id: "priya",
    name: "Sharma, Priya",
    age: "41 y",
    dob: "30 Apr 1985 (41 y)",
    priority: "Routine",
    created: "20 Aug 10:11",
    who: "—",
    request: "Feeling tired all the time, can I have a blood test",
    signals: [],
    thread: [],
    silent: false,
    presence: false,
    checked: false,
  },
];

function isContextOnly(s) {
  // Age, SLA/priority, thread counts and carry-over never own the rail.
  return (
    s.kind === "green" ||
    s.kind === "meta" ||
    s.source === "date of birth" ||
    s.source === "contact ledger" ||
    s.source === "task ledger" ||
    s.source === "Medicus flag"
  );
}

function worst(signals) {
  const rank = { red: 3, amber: 2, green: 1, info: 1, meta: 0 };
  const clinical = signals.filter((s) => !isContextOnly(s));
  let w = null;
  for (const s of clinical) {
    if (!w || rank[s.kind] > rank[w.kind]) w = s;
  }
  if (w) {
    const req = clinical.find((s) => s.kind === w.kind && s.source.includes("request"));
    if (req) w = req;
  }
  return w;
}

function railClass(row) {
  if (!row.checked) return "unchecked";
  const w = worst(row.signals);
  if (!w) return "";
  if (w.kind === "red") return "red";
  if (w.kind === "amber") return "amber";
  return "";
}

function chip(s) {
  const dash = s.kind === "meta" ? " dash" : "";
  return `<span class="chip ${s.kind}${dash}">${s.name}</span>`;
}

function pulseHead(row) {
  const w = worst(row.signals);
  const extras = row.signals.filter((s) => s !== w && s.kind !== "green").length;
  const pf = row.signals.find((s) => s.kind === "green");
  if (!w && !pf) return "";
  const dia = w && row.silent && w.source.includes("record")
    ? `<i class="diamond${w.kind === "amber" ? " amber" : ""}" title="From the record, not the request text"></i>`
    : "";
  const head = w ? `<span class="chip ${w.kind}">${w.name}</span>` : "";
  const more = extras > 0 ? `<span class="more">· ${extras}</span>` : "";
  const pfc = pf ? chip(pf) : "";
  return `<div class="pulse-head">${dia}${head}${more}${pfc}</div>`;
}

function todayChips(row) {
  if (!row.signals.length) return "";
  return `<div class="chips">${row.signals.map(chip).join("")}</div>`;
}

function whyTray(row) {
  const items = row.signals.map((s) => {
    const mark = s.kind === "green" ? "info" : s.kind;
    return `<li>
      <i class="mark ${mark}"></i>
      <div><strong>${s.name}</strong>
        <span class="src">${s.source}${s.evidence ? " — " + s.evidence : ""}</span>
      </div>
    </li>`;
  }).join("");
  return `<div class="tray">
    <h3>Why this is marked</h3>
    <ul class="why-list">${items}</ul>
    <p class="why-foot">Not a score. A quiet rail is not all-clear — it means nothing matched, or we have not checked the record yet.</p>
  </div>`;
}

function actTray(row, confirming) {
  const pf = !!row.pf;
  const ask = row.signals.some((s) => s.name === "Ask-back");
  return `<div class="tray">
    <h3>1. Stage a next step ↓ &nbsp; 2. Then confirm. Nothing is sent from here.</h3>
    <div class="acts">
      <button type="button"><em>1</em> Book<small>Draft a next-green-day note — does not hold a slot</small></button>
      <button type="button" class="${pf ? "primary" : ""}" ${pf ? "" : "disabled"}>
        <em>2</em> Pharmacy First<small>${pf ? "Insert the pathway sentence into the comment" : "Age or pathway not confirmed"}</small>
      </button>
      <button type="button" class="${ask && !pf ? "primary" : ""}" ${ask ? "" : "disabled"}>
        <em>3</em> Ask-back<small>${ask ? "Gap questions as a comment draft" : "No pathway gaps on this request"}</small>
      </button>
      <button type="button"><em>4</em> Park until…<small>Local only — Medicus status unchanged</small></button>
    </div>
    ${confirming ? `<div class="confirm">
      <strong>Not yet submitted.</strong>
      Added to the comment below: “Sore throat — Pharmacy First pathway. Patient can swallow, no fever volunteered.” Until you confirm, reception sees nothing.
      <span class="go">Confirm insert</span>
    </div>` : ""}
  </div>`;
}

function threadBlock(row, open) {
  if (!row.thread.length) return "";
  const mark = `<span class="thread-mark"><strong>${row.thread.length}</strong> · ${row.threadDays}d</span>`;
  if (!open) return mark;
  const items = row.thread.map((t) => `<li><time>${t.when}</time>${t.text}</li>`).join("");
  return `${mark}<ul class="stack">${items}</ul>`;
}

function renderRow(row, mode, opts) {
  const showPulse = mode !== "today";
  const showChips = mode === "today";
  const rail = showPulse ? railClass(row) : (worst(row.signals)?.kind === "red" ? "red" : worst(row.signals)?.kind === "amber" ? "amber" : "");
  const cursor = opts.cursor === row.id ? " is-cursor" : "";
  const seen = row.seen && mode !== "today" ? " is-seen" : "";
  const why = opts.why === row.id;
  const act = opts.act === row.id;
  const threadOpen = opts.thread === row.id;
  const pri = row.priority === "Urgent" ? `<span class="pri-u">${row.priority}</span>` : row.priority;

  const previewInner = `
    ${showChips ? todayChips(row) : ""}
    ${showPulse ? pulseHead(row) : ""}
    <div class="req">${row.request}</div>
  `;

  const tray = why ? whyTray(row) : act ? actTray(row, opts.confirm) : "";

  return `<div class="g-row${cursor}${seen}">
    <div class="cell rail">${showPulse && rail ? `<i class="${rail}"></i>` : (mode === "today" && (worst(row.signals)?.kind === "red" || worst(row.signals)?.kind === "amber") ? `<i class="${worst(row.signals).kind === "red" ? "red" : "amber"}"></i>` : "")}</div>
    <div class="cell check">☐</div>
    <div class="cell">
      <div class="name">${row.name}${row.presence ? EYE : ""}<span class="age">${row.dob}</span></div>
      ${mode === "thread" || mode === "composed" ? threadBlock(row, threadOpen) : (row.thread.length && showPulse ? threadBlock(row, false) : "")}
    </div>
    <div class="cell pri">${pri}</div>
    <div class="cell created">${row.created}</div>
    <div class="cell preview">${previewInner}</div>
    <div class="cell">${showPulse ? `<button class="act-btn${act ? " on" : ""}" type="button" aria-label="Stage a next step">›</button>` : ""}</div>
    ${tray}
  </div>`;
}

function huddle(mode) {
  if (mode === "today") return "";
  return `<div class="huddle">
    <b class="hot">2 red</b>
    <b>1 child</b>
    <b>1 claimed</b>
  </div>`;
}

function legend(mode) {
  if (mode === "today") return "";
  return `<div class="legend">
    <span><i class="swatch red"></i> Filled rail — a named red signal</span>
    <span><i class="swatch amber"></i> Hollow ring — worst is amber</span>
    <span><i class="swatch dash"></i> Dashed — record not checked</span>
    <span><i class="swatch dia"></i> Diamond — headline from the record, not the request</span>
  </div>`;
}

function desk(innerToolbar, body, extraLegend) {
  return `<div class="desk">
    <div class="os-bar">
      <div class="os-dots"><i></i><i></i><i></i></div>
      <div class="os-url">https://practice.api.england.medicus.health/tasks/medical-request</div>
    </div>
    <div class="app-bar">
      <span class="brand">Medicus</span>
      <span class="crumb">Tasks / Medical requests</span>
      <span class="meta">MOCK — not a live patient list</span>
    </div>
    <div class="toolbar">
      <h1>Medical requests</h1>
      <span class="count">8 open</span>
      ${innerToolbar}
    </div>
    <div class="grid">
      <div class="g-head">
        <span></span><span></span>
        <span>Patient</span><span>Priority</span><span>Created</span><span>Request</span><span></span>
      </div>
      ${body}
    </div>
    ${extraLegend || ""}
  </div>`;
}

function renderFrame(id) {
  const colorblind = id === "colorblind";
  const mode = id === "colorblind" || id === "composed" ? "composed" : id;
  let opts = { cursor: null, why: null, act: null, thread: null, confirm: false };
  let list = ROWS;

  if (id === "today") {
    opts = { cursor: null, why: null, act: null, thread: null };
  } else if (id === "pulse-scan" || id === "colorblind") {
    opts = { cursor: "tom", why: null, act: null, thread: null };
  } else if (id === "pulse-why") {
    opts = { cursor: "amina", why: "amina", act: null, thread: null };
  } else if (id === "act-stage") {
    opts = { cursor: "farah", why: null, act: "farah", thread: null };
  } else if (id === "act-confirm") {
    opts = { cursor: "farah", why: null, act: "farah", thread: null, confirm: true };
  } else if (id === "thread") {
    opts = { cursor: "chioma", why: null, act: null, thread: "chioma" };
  } else if (id === "silent") {
    opts = { cursor: "david", why: "david", act: null, thread: null };
  } else if (id === "composed") {
    opts = { cursor: "amina", why: null, act: null, thread: null };
  }

  const renderMode = (id === "today") ? "today"
    : (id === "thread") ? "thread"
    : (id === "pulse-why" || id === "silent") ? "pulse-scan"
    : "composed";

  const body = list.map((r) => renderRow(r, renderMode === "today" ? "today" : (id === "thread" ? "thread" : "composed"), opts)).join("");
  return desk(huddle(id === "today" ? "today" : "pulse"), body, legend(id === "today" ? "today" : "pulse"));
}

const params = new URLSearchParams(location.search);
const shot = params.get("shot");
const page = document.getElementById("page");
if (shot) page.classList.add("shot");

const chooser = document.getElementById("chooser");
const frames = document.getElementById("frames");

FRAMES.forEach((f, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = `${i + 1}  ${f.id}`;
  btn.dataset.id = f.id;
  chooser.appendChild(btn);

  const sec = document.createElement("section");
  sec.className = "frame";
  sec.id = "frame-" + f.id;
  sec.dataset.shot = f.id;
  sec.innerHTML = `<p class="caption">${f.title}</p><p class="subcap">${f.sub}</p>${renderFrame(f.id)}`;
  if (f.id === "colorblind") sec.setAttribute("data-colorblind", "true");
  frames.appendChild(sec);
});

function show(id) {
  document.documentElement.toggleAttribute("data-colorblind", id === "colorblind");
  document.querySelectorAll(".frame").forEach((el) => el.classList.toggle("is-on", el.dataset.shot === id));
  document.querySelectorAll(".chooser button").forEach((b) => b.setAttribute("aria-current", b.dataset.id === id ? "true" : "false"));
  history.replaceState(null, "", shot ? ("?shot=" + id) : ("#" + id));
}

chooser.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) show(b.dataset.id);
});

show(shot || location.hash.replace("#", "") || "today");
</script>
