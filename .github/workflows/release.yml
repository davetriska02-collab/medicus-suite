name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Derive version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Check if release already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          echo "release_exists=$([ "$STATUS" = '200' ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.check.outputs.release_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build extension zip and CRX
        if: steps.check.outputs.release_exists == 'false'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          node scripts/pack-crx.js --zip --crx --allow-missing-key --out-dir _build
          mkdir -p _release
          cp "_build/medicus-suite-v${{ steps.version.outputs.version }}.zip" _release/
          cp _build/SHA256SUMS.txt _release/
          if [ -f "_build/medicus-suite-v${{ steps.version.outputs.version }}.crx" ]; then
            cp "_build/medicus-suite-v${{ steps.version.outputs.version }}.crx" _release/
            echo "crx=true" >> "$GITHUB_OUTPUT"
          else
            echo "crx=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CRX skipped — add repo secret CRX_PRIVATE_KEY to attach a signed .crx"
          fi
          echo "----- SHA256SUMS -----"
          cat _release/SHA256SUMS.txt
        id: pack

      - name: Build release notes from CHANGELOG
        if: steps.check.outputs.release_exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md (everything
          # between this version's "## [vX.Y.Z]" header and the next "## [v" header).
          awk -v ver="## [v${VERSION}]" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## \[v/ { exit }
            grab { print }
          ' CHANGELOG.md > _section.md
          {
            if [ -s _section.md ]; then
              sed -e '1{/^$/d}' _section.md
            else
              echo "Maintenance release. See CHANGELOG.md for details."
            fi
            echo
            echo "---"
            echo
            echo "### Install (unpacked — Chrome / Edge)"
            echo "1. Download \`medicus-suite-v${VERSION}.zip\` below and unzip it."
            echo "2. Open \`chrome://extensions\` and enable **Developer mode** (top-right)."
            echo "3. Click **Load unpacked** and select the unzipped \`medicus-suite-v${VERSION}\` folder."
            echo "4. Pin the extension and open the side panel. Full steps: [README](https://github.com/${{ github.repository }}/blob/main/README.md)."
            echo
            if [ -f "_release/medicus-suite-v${VERSION}.crx" ]; then
              echo "### Enterprise CRX (practice IT)"
              echo "Extension id: \`$(tr -d '[:space:]' < packaging/extension-id.txt)\`"
              echo
              echo "Download \`medicus-suite-v${VERSION}.crx\` below. Managed Chrome / Edge will **not** install it by double-click — force-install via enterprise policy. Steps: [docs/IT-ENTERPRISE-INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/IT-ENTERPRISE-INSTALL.md)."
              echo
            fi
            echo "### Verify your download"
            echo "Download \`SHA256SUMS.txt\` alongside the zip, then:"
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
          } > RELEASE_NOTES.md
          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        if: steps.check.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Medicus Suite ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            _release/*
          draft: false
          prerelease: false
