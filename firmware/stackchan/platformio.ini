; Medicus Suite — StackChan presence firmware (ESP32-S3 / M5Stack CoreS3)
; Flash: copy secrets.h.example → secrets.h, then:
;   pio run -e m5stack-cores3 -t upload
;
; Arduino IDE: open stackchan.ino, board = "M5Stack CoreS3", same libraries.

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.7
  madhephaestus/ESP32Servo@^3.0.6
  adafruit/Adafruit NeoPixel@^1.12.5
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSTACKCHAN_CAMERA_ENABLED=0
  -DSTACKCHAN_MIC_ENABLED=0
  -DSTACKCHAN_MQTT_ENABLED=0

; Optional MQTT subscribe (needs a practice broker). Off by default —
; Suite v1 POSTs HTTP JSON and does not need this.
[env:m5stack-cores3-mqtt]
extends = env:m5stack-cores3
lib_deps =
  ${env:m5stack-cores3.lib_deps}
  knolleary/PubSubClient@^2.8
build_flags =
  ${env:m5stack-cores3.build_flags}
  -USTACKCHAN_MQTT_ENABLED
  -DSTACKCHAN_MQTT_ENABLED=1
