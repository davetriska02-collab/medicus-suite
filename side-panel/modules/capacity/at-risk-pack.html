<!-- Medicus Suite — Capacity at-risk pack (print-first page).
     Opened in a full tab by the Capacity module; reads its data from the
     transient 'capacity.riskPack' storage key written just before the tab opens. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Capacity at risk — Medicus Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff; color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px; line-height: 1.5;
      max-width: 800px; margin: 0 auto; padding: 28px 32px;
    }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    .toolbar button {
      background: #2563eb; color: #fff; border: none; border-radius: 6px;
      padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.9; }
    .toolbar .hint { font-size: 12px; color: #555; }

    h1 { font-size: 18px; margin-bottom: 4px; }
    .meta { font-size: 12px; color: #444; margin-bottom: 6px; line-height: 1.5; }
    .summary {
      background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px;
      padding: 10px 14px; margin: 14px 0 16px; font-size: 13px;
    }
    .note {
      font-size: 11px; color: #555; margin-bottom: 14px; font-style: italic;
    }

    table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    th, td {
      border: 1px solid #bbb; padding: 6px 8px; text-align: left;
      vertical-align: top;
    }
    th { background: #f3f4f6; font-weight: 600; }
    td.num { font-variant-numeric: tabular-nums; }
    .status-critical { color: #b91c1c; font-weight: 700; }
    .status-low { color: #c2410c; font-weight: 600; }
    .status-tight { color: #ca8a04; font-weight: 600; }

    .footer {
      margin-top: 22px; padding-top: 10px; border-top: 1px solid #bbb;
      font-size: 11px; color: #555; line-height: 1.6;
    }
    .empty { padding: 40px 0; color: #555; font-size: 14px; }

    @media print {
      .no-print { display: none !important; }
      body { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <button id="printBtn" type="button">Print / save as PDF</button>
    <span class="hint">Tip: in the print window choose &ldquo;Save as PDF&rdquo; to keep a file instead of printing.</span>
  </div>
  <div id="content"><div class="empty">Loading capacity pack&hellip;</div></div>
  <script src="at-risk-pack.js"></script>
</body>
</html>
