<!-- Medicus Suite — Capacity at-risk pack (print-first page).
     Opened in a full tab by the Capacity module; reads its data from the
     transient 'capacity.riskPack' storage key written just before the tab opens. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Capacity at risk — Medicus Suite</title>
  <style>
    /* Print-first: white paper styling on screen too, so what you see is what prints. */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      max-width: 210mm;
      margin: 0 auto;
      padding: 28px 32px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    .toolbar button {
      background: #1f2937;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.9; }
    .toolbar .hint { font-size: 12px; color: #555; }

    .doc-header { margin-bottom: 16px; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    h2 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid #333;
    }
    .meta {
      font-size: 12px;
      color: #444;
      margin-bottom: 4px;
      line-height: 1.55;
    }
    .risk-def {
      font-size: 12px;
      color: #333;
      margin-top: 8px;
      line-height: 1.55;
    }

    .incomplete-banner {
      border: 2px solid #111;
      background: #f3f4f6;
      padding: 10px 14px;
      margin: 14px 0 16px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }
    .incomplete-banner .detail {
      font-weight: 400;
      margin-top: 4px;
      font-size: 12px;
    }

    .summary-block {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      padding: 12px 14px;
      margin: 0 0 18px;
    }
    .summary-block p { font-size: 13px; line-height: 1.55; }
    .summary-block .post-holiday-note {
      margin-top: 8px;
      font-size: 12px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #eee;
      font-weight: 700;
    }
    td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; }

    .status-cell { font-weight: 700; }
    .status-tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .status-critical {
      border-left: 5px solid #111;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.06) 2px,
        rgba(0, 0, 0, 0.06) 4px
      );
    }
    .status-low {
      border-left: 4px solid #111;
      background: #e5e7eb;
    }
    .status-tight {
      border-left: 3px solid #111;
      background: #f3f4f6;
    }

    .why-note {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #333;
      font-style: italic;
    }

    .empty-ok {
      border: 1px solid #bbb;
      padding: 24px 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
    }
    .empty-ok strong { display: block; font-size: 15px; margin-bottom: 6px; }

    .footer {
      margin-top: 22px;
      padding-top: 10px;
      border-top: 1px solid #bbb;
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }
    .footer p + p { margin-top: 4px; }

    .empty {
      padding: 40px 0;
      color: #555;
      font-size: 14px;
    }

    @page {
      size: A4;
      margin: 15mm;
    }

    @media print {
      .no-print { display: none !important; }
      body { padding: 0; max-width: none; }
      h1, h2, .summary-block, .incomplete-banner { page-break-after: avoid; }
      .summary-block, .incomplete-banner, .empty-ok { page-break-inside: avoid; }
      p { orphans: 3; widows: 3; }
      thead { display: table-header-group; }
      tr { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <button id="printBtn" type="button">Print</button>
    <span class="hint">Tip: in the print window choose &ldquo;Save as PDF&rdquo; to keep a file instead of printing.</span>
  </div>
  <div id="content"><div class="empty">Loading capacity pack&hellip;</div></div>
  <script src="at-risk-pack.js"></script>
</body>
</html>
